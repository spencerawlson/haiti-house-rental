<!doctype html>
<html lang="ht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Kay Ayiti — Offline</title>
<!-- Self-contained on purpose: this page is served by the service worker
     when the network is down, so it must not depend on any CSS, font or
     script that might not be cached. Inline styles only. -->
<style>
  :root { color-scheme: light dark; --bg:#ffffff; --fg:#0f172a; --muted:#64748b; --accent:#f87171; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b1220; --fg:#e2e8f0; --muted:#94a3b8; } }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:16px;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
  }
  img.logo { width:88px; height:88px; object-fit:contain; border-radius:20px; }
  h1 { margin:0; font-size:1.3rem; font-weight:800; }
  p { margin:0; max-width:30rem; line-height:1.5; }
  p.ht { color:var(--fg); font-size:1rem; }
  p.fr, p.en { color:var(--muted); font-size:.85rem; }
  button {
    margin-top:6px; border:0; border-radius:999px; padding:12px 28px;
    background:var(--accent); color:#fff; font-weight:800; font-size:1rem; cursor:pointer;
  }
  button:active { transform: translateY(1px); }
</style>
</head>
<body>
  <img class="logo" src="/logo.png" alt="Kay Ayiti">
  <h1>Kay Ayiti</h1>
  <p class="ht"><strong>Koneksyon entènèt la koupe.</strong> Tcheke koneksyon ou epi eseye ankò.</p>
  <p class="fr">Pas de connexion Internet. Vérifiez votre connexion et réessayez.</p>
  <p class="en">You're offline. Check your connection and try again.</p>
  <button type="button" onclick="location.reload()">Eseye ankò</button>
</body>
</html>
