# Kay Ayiti mobile builds — Android + iOS from the Capacitor scaffold.
# The apps load the live site (remote-URL mode, server.url in
# capacitor.config.ts), so no web build is bundled; CI builds the native
# shells only. Nothing here publishes to a store — publishing is manual.
name: Build mobile apps

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/build-mobile.yml'
  workflow_dispatch:

jobs:
  android:
    name: Android (AAB + APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Capacitor 8 needs Node >= 22 and JDK 21.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Sync Capacitor Android shell
        run: npx cap sync android
      - name: Build release AAB and APK
        working-directory: android
        run: |
          ./gradlew --no-daemon bundleRelease assembleRelease assembleDebug
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: kay-ayiti-android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      # Release outputs are unsigned until a signing key is set up for the
      # Play Store; the debug APK installs directly on a phone for testing.
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: kay-ayiti-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload debug APK (installable for testing)
        uses: actions/upload-artifact@v4
        with:
          name: kay-ayiti-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    name: iOS (signed IPA, or setup steps if secrets are absent)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for Apple signing secrets
        id: secrets-check
        env:
          P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          if [ -z "$P12" ] || [ -z "$P12_PASS" ] || [ -z "$PROFILE" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Print iOS signing setup steps (no secrets configured)
        if: steps.secrets-check.outputs.present == 'false'
        run: |
          echo "iOS signing is not configured, so this job stops here on purpose."
          echo "It still succeeds — missing Apple secrets must never fail CI."
          echo ""
          echo "To enable signed iOS builds, do this once:"
          echo "1. Enroll in the Apple Developer Program (US\$99/year) at"
          echo "   https://developer.apple.com/programs/enroll/"
          echo "2. In Xcode or developer.apple.com, create an App ID for"
          echo "   com.kayayiti.app and a distribution certificate + provisioning"
          echo "   profile for App Store distribution."
          echo "3. Export the distribution certificate as a .p12 file and"
          echo "   base64-encode it: base64 -i cert.p12 | tr -d '\n'"
          echo "4. In this repo, go to Settings -> Secrets and variables ->"
          echo "   Actions, and add these three repository secrets:"
          echo "   - APPLE_CERTIFICATE_P12: the base64 .p12 from step 3"
          echo "   - APPLE_CERTIFICATE_PASSWORD: the .p12 export password"
          echo "   - APPLE_PROVISIONING_PROFILE: the base64 .mobileprovision file"
          echo "5. Re-run this workflow. The signed IPA build below will run."
          echo "6. Upload the IPA to App Store Connect (Transporter app or"
          echo "   Xcode) and submit from there."
      - uses: actions/setup-node@v4
        if: steps.secrets-check.outputs.present == 'true'
        with:
          node-version: 22
      - name: Install dependencies
        if: steps.secrets-check.outputs.present == 'true'
        run: npm ci
      - name: Sync Capacitor iOS shell
        if: steps.secrets-check.outputs.present == 'true'
        run: npx cap sync ios
      - name: Install signing certificate and provisioning profile
        if: steps.secrets-check.outputs.present == 'true'
        env:
          P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import "$CERT_PATH" -k build.keychain -P "$P12_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/kayayiti.mobileprovision
      - name: Build signed IPA
        if: steps.secrets-check.outputs.present == 'true'
        working-directory: ios/App
        run: |
          # App Store Connect rejects a build number it has already seen, and
          # the project file says 1 (uploaded on 23 Oct). Every run of this
          # workflow has a higher run number, so each upload is accepted; the
          # +100 keeps it clear of any build number uploaded by hand.
          BUILD_NUMBER=$(( GITHUB_RUN_NUMBER + 100 ))
          echo "iOS build number: $BUILD_NUMBER"
          # Archive requires a scheme; the scaffold shipped none, so the repo
          # now carries a shared App scheme — build via -project/-scheme.
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/KayAyiti.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/KayAyiti.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/ipa"
      - name: Upload IPA
        if: steps.secrets-check.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kay-ayiti-ios-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
      - name: Upload IPA to App Store Connect
        if: steps.secrets-check.outputs.present == 'true'
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8
          IPA=$(ls "$RUNNER_TEMP"/ipa/*.ipa | head -n 1)
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
