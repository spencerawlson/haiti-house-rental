name: Web CI

# Build the web app and run the auth/authorization regression tests
# against a throwaway Postgres — never production.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kayayiti
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: kayayiti
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kayayiti -d kayayiti"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://kayayiti:ci-only@localhost:5432/kayayiti
      ADMIN_PASSWORD: ci-admin-password
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Known vulnerabilities in production dependencies. Reported on every
      # run; it fails the job only for high/critical advisories.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Fake clock for reminder tests
        # The reminder window tests run under a pinned clock (Stage 2,
        # A3): today 11:00 Haiti, so tomorrow's visits always sit in
        # their two_days window whatever the real hour. Only the
        # reminder path reads this (see app/api/cron/route.js).
        run: echo "KAY_FAKE_NOW_MS=$(node -e 'const f = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Port-au-Prince", year: "numeric", month: "2-digit", day: "2-digit" }); const p = Object.fromEntries(f.formatToParts(new Date()).filter((x) => x.type !== "literal").map((x) => [x.type, x.value])); const naive = Date.parse(p.year + "-" + p.month + "-" + p.day + "T11:00:00Z"); const off = (ms) => { const d = new Date(ms); return new Date(d.toLocaleString("en-US", { timeZone: "America/Port-au-Prince" })).getTime() - new Date(d.toLocaleString("en-US", { timeZone: "UTC" })).getTime(); }; console.log(naive - off(naive));')" >> "$GITHUB_ENV"
      - name: Start app
        run: |
          node .next/standalone/server.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health && break; sleep 2; done
        env:
          PORT: 3000
          HOSTNAME: 127.0.0.1
          # The sold/leased auto-deletion is 48 h in production. The
          # regression test cannot wait for that, so CI runs the app with
          # a few seconds instead; the test skips when this is unset.
          SOLD_DELETE_AFTER_MS: 4000
          # Lets the scheduled-job tests actually trigger /api/cron.
          CRON_SECRET: ci-cron-secret
          # Lets the subscription lifecycle tests exercise expiry and
          # deactivation for real instead of waiting months.
          BILLING_QUARTER_MS: 4000
          BILLING_GRACE_MS: 4000
          BILLING_DUE_REMINDER_MS: 3000
          # The suite signs up more accounts than one IP may in an hour.
          SIGNUP_LIMIT_PER_HOUR: 1000
          # Pinned clock for the reminder window tests (see above).
          KAY_FAKE_NOW_MS: ${{ env.KAY_FAKE_NOW_MS }}
      - name: Regression tests
        run: npm test
        env:
          BASE_URL: http://localhost:3000
          SOLD_DELETE_AFTER_MS: 4000
          CRON_SECRET: ci-cron-secret
          BILLING_QUARTER_MS: 4000
          BILLING_GRACE_MS: 4000
          BILLING_DUE_REMINDER_MS: 3000
          KAY_FAKE_NOW_MS: ${{ env.KAY_FAKE_NOW_MS }}
      - name: Server log
        if: failure()
        run: cat server.log
