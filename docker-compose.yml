services:
  db:
    image: postgres:16-alpine
    container_name: kayayiti-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kayayiti
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kayayiti}
      POSTGRES_DB: kayayiti
    volumes:
      - kayayiti-pgdata:/var/lib/postgresql/data
    # No ports published: the database is only reachable from the app
    # container on the compose network, never from the internet or LAN.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kayayiti -d kayayiti"]
      interval: 5s
      timeout: 5s
      retries: 12

  kayayiti:
    build: .
    container_name: kayayiti-web
    restart: unless-stopped
    ports:
      - "8097:3000"
    environment:
      # Set a strong password before launch. Without it, the admin area
      # stays closed (fail closed) and nobody can administer the app.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # The app creates its tables on first boot and seeds the 7 demo
      # listings only when the listings table is empty — restarts and
      # rebuilds never wipe real data.
      - DATABASE_URL=postgres://kayayiti:${POSTGRES_PASSWORD:-kayayiti}@db:5432/kayayiti
      # Optional (see ENVIRONMENT.md): extra key for admin sessions, extra
      # allowed origins for the CSRF guard, and a one-off migration
      # rollback target. Leave empty normally.
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - MIGRATE_DOWN_TO=${MIGRATE_DOWN_TO:-}
      # Demo listings stay hidden unless this is "true" (previews only).
      - SHOW_DEMO_LISTINGS=${SHOW_DEMO_LISTINGS:-}
      # Notifications (optional, see ENVIRONMENT.md). Unset = in-app only.
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_API_KEY_SID=${TWILIO_API_KEY_SID:-}
      - TWILIO_API_KEY_SECRET=${TWILIO_API_KEY_SECRET:-}
      - TWILIO_SMS_FROM=${TWILIO_SMS_FROM:-}
      - TWILIO_WHATSAPP_FROM=${TWILIO_WHATSAPP_FROM:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://kayayiti.app}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - kayayiti-uploads:/app/public/uploads

  # Automatic backups (scripts/backup-loop.sh): one at start, then every
  # 24 h — database dump + uploads archive into ./backups (or BACKUP_DIR),
  # kept BACKUP_KEEP_DAYS days. Read-only access to the uploads volume.
  backup:
    image: postgres:16-alpine
    container_name: kayayiti-backup
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-kayayiti}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - kayayiti-uploads:/uploads:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - ./scripts/backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ["/bin/sh", "/backup-loop.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  kayayiti-uploads:
  kayayiti-pgdata:
